<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Specimen 05 — Field.io</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ground: #0B0B0F;
      --ink: #FFFFFF;
      --muted: #A0A4B0;
      --cyan: #0CE0E5;
      --violet: #5B2EFF;
      --ease: cubic-bezier(0.83, 0, 0.17, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--ground);
      color: var(--ink);
      font-family: Syne, "Helvetica Neue", sans-serif;
      overflow: hidden;
      text-wrap: pretty;
    }

    a { color: inherit; text-decoration: none; }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .chrome {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      pointer-events: none;
      padding: 24px 32px 32px;
    }

    .chrome a,
    .chrome button {
      pointer-events: auto;
    }

    header, footer {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    header a:hover,
    header a:focus-visible {
      color: var(--ink);
      outline: none;
    }

    .static-title {
      display: none;
      align-self: center;
      font-weight: 800;
      font-size: clamp(48px, 12vw, 140px);
      letter-spacing: -0.04em;
      line-height: 0.9;
    }

    body.is-still .static-title { display: block; }
    body.is-still canvas { opacity: 0.18; }

    footer p {
      max-width: 22em;
      line-height: 1.5;
      letter-spacing: 0;
      text-transform: none;
      font-size: 14px;
      color: var(--muted);
    }

    .btn {
      pointer-events: auto;
      font-family: Syne, sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--ink);
      padding: 10px 16px;
      cursor: pointer;
      border-radius: 0;
      transition: background 700ms var(--ease), color 700ms var(--ease);
    }

    .btn:hover,
    .btn:focus-visible {
      background: var(--ink);
      color: var(--ground);
      outline: none;
    }

    .tweaks-toggle,
    .tweaks {
      position: fixed;
      z-index: 20;
      bottom: 20px;
      right: 20px;
      pointer-events: auto;
      font-family: Syne, sans-serif;
    }

    .tweaks-toggle {
      background: var(--ground);
      color: var(--ink);
      border: 1px solid rgba(255,255,255,0.2);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 8px 12px;
      cursor: pointer;
    }

    .tweaks-toggle:focus-visible { outline: 1px solid var(--cyan); outline-offset: 3px; }

    .tweaks {
      width: 250px;
      background: #0B0B0F;
      color: var(--ink);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 16px;
      display: none;
    }

    .tweaks.is-open { display: block; }

    .tweaks h2 {
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .tweaks label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .tweaks select {
      width: 100%;
      background: #111;
      color: var(--ink);
      border: 1px solid rgba(255,255,255,0.2);
      font-family: Syne, sans-serif;
      padding: 8px;
    }

    .tweaks-close {
      margin-top: 12px;
      background: none;
      border: 0;
      color: var(--muted);
      font-family: Syne, sans-serif;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
    }

    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
    }
  </style>
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>
  <div class="chrome">
    <header>
      <a href="index.html">Specimen 05</a>
      <span>Generative type</span>
    </header>
    <h1 class="static-title">FORM</h1>
    <footer>
      <p>The page makes itself. Letters arrive from a field. Cursor is a local gravity well.</p>
      <button class="btn" type="button">Hold still</button>
    </footer>
  </div>

  <button class="tweaks-toggle" type="button" id="tweaksOpen">Tweaks</button>
  <aside class="tweaks" id="tweaks" hidden>
    <h2>Tweaks</h2>
    <label for="motion">Motion</label>
    <select id="motion">
      <option value="on">On</option>
      <option value="off">Off</option>
    </select>
    <button class="tweaks-close" type="button" id="tweaksClose">Close</button>
  </aside>

  <script>
    const canvas = document.getElementById("field");
    const ctx = canvas.getContext("2d");
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const motionSelect = document.getElementById("motion");
    const panel = document.getElementById("tweaks");
    const openBtn = document.getElementById("tweaksOpen");
    const closeBtn = document.getElementById("tweaksClose");

    let running = !reduce;
    let particles = [];
    let mouse = { x: -9999, y: -9999 };
    let raf = 0;
    const WORD = "FORM";

    function setOpen(open) {
      panel.hidden = !open;
      panel.classList.toggle("is-open", open);
      openBtn.hidden = open;
    }

    openBtn.addEventListener("click", () => setOpen(true));
    closeBtn.addEventListener("click", () => setOpen(false));

    function setStill(still) {
      document.body.classList.toggle("is-still", still);
      running = !still;
      if (running) loop();
    }

    if (reduce) {
      motionSelect.value = "off";
      setStill(true);
    }

    motionSelect.addEventListener("change", () => setStill(motionSelect.value === "off"));

    function sampleGlyphs() {
      const w = canvas.width;
      const h = canvas.height;
      const off = document.createElement("canvas");
      off.width = w;
      off.height = h;
      const octx = off.getContext("2d");
      const size = Math.min(w * 0.28, h * 0.42);
      octx.fillStyle = "#fff";
      octx.font = "800 " + size + "px Syne, sans-serif";
      octx.textAlign = "center";
      octx.textBaseline = "middle";
      octx.fillText(WORD, w / 2, h / 2 - h * 0.04);
      const data = octx.getImageData(0, 0, w, h).data;
      const pts = [];
      const step = Math.max(4, Math.floor(w / 280));
      for (let y = 0; y < h; y += step) {
        for (let x = 0; x < w; x += step) {
          if (data[(y * w + x) * 4 + 3] > 140) pts.push({ x, y });
        }
      }
      return pts;
    }

    function resize() {
      canvas.width = window.innerWidth * devicePixelRatio;
      canvas.height = window.innerHeight * devicePixelRatio;
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
      const targets = sampleGlyphs();
      const count = Math.min(targets.length, 1400);
      particles = [];
      for (let i = 0; i < count; i++) {
        const t = targets[i % targets.length];
        particles.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          tx: t.x / devicePixelRatio,
          ty: t.y / devicePixelRatio,
          vx: 0,
          vy: 0,
          hue: i % 2
        });
      }
    }

    function loop() {
      if (!running) return;
      const w = window.innerWidth;
      const h = window.innerHeight;
      ctx.fillStyle = "rgba(11,11,15,0.22)";
      ctx.fillRect(0, 0, w, h);

      for (const p of particles) {
        let dx = p.tx - p.x;
        let dy = p.ty - p.y;
        p.vx += dx * 0.045;
        p.vy += dy * 0.045;

        const mx = p.x - mouse.x;
        const my = p.y - mouse.y;
        const md = mx * mx + my * my;
        if (md < 16000) {
          const f = (16000 - md) / 16000;
          p.vx += (mx / 80) * f * 18;
          p.vy += (my / 80) * f * 18;
        }

        p.vx *= 0.82;
        p.vy *= 0.82;
        p.x += p.vx;
        p.y += p.vy;

        ctx.fillStyle = p.hue ? "rgba(12,224,229,0.9)" : "rgba(91,46,255,0.85)";
        ctx.fillRect(p.x, p.y, 1.6, 1.6);
      }
      raf = requestAnimationFrame(loop);
    }

    window.addEventListener("resize", () => {
      cancelAnimationFrame(raf);
      resize();
      if (running) loop();
    });

    window.addEventListener("pointermove", (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    window.addEventListener("pointerleave", () => {
      mouse.x = -9999;
      mouse.y = -9999;
    });

    const holdBtn = document.querySelector(".btn");

    function syncHoldLabel() {
      holdBtn.textContent = running ? "Hold still" : "Let it run";
    }

    holdBtn.addEventListener("click", () => {
      const nextStill = running;
      motionSelect.value = nextStill ? "off" : "on";
      setStill(nextStill);
      syncHoldLabel();
    });

    motionSelect.addEventListener("change", syncHoldLabel);
    syncHoldLabel();

    function boot() {
      resize();
      ctx.fillStyle = "#0B0B0F";
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
      if (running) loop();
    }

    if (document.fonts && document.fonts.ready) document.fonts.ready.then(boot);
    else boot();
  </script>
</body>
</html>
