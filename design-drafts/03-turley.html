<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Specimen 03 — Turley</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ground: #FFFFFF;
      --ink: #000000;
      --alert: #FF3D00;
      --signal: #FFE800;
      --blue: #001AFF;
      --display: "Archivo Black", "Arial Black", sans-serif;
      --serif: "Source Serif 4", "Iowan Old Style", Georgia, serif;
    }

    [data-ground="black"] {
      --ground: #000000;
      --ink: #FFFFFF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--ground);
      color: var(--ink);
      font-family: var(--serif);
      overflow-x: hidden;
      text-wrap: pretty;
    }

    a { color: inherit; text-decoration: none; }

    .mast {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 12px 16px 0;
      font-family: var(--display);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .mast a:hover,
    .mast a:focus-visible {
      background: var(--signal);
      color: #000;
      outline: none;
    }

    .spread {
      position: relative;
      min-height: 100vh;
      padding-bottom: 48px;
    }

    .display {
      font-family: var(--display);
      font-weight: 400;
      font-size: clamp(72px, 22vw, 280px);
      line-height: 0.78;
      letter-spacing: -0.06em;
      text-transform: uppercase;
      margin-left: -2vw;
      margin-right: -8vw;
      width: 110vw;
      word-break: break-word;
    }

    .display span {
      display: block;
    }

    .display .loud {
      background: var(--alert);
      color: #fff;
      display: inline-block;
      padding-right: 0.08em;
      margin-left: 12vw;
    }

    [data-ground="black"] .display .loud {
      color: #000;
    }

    .slab {
      position: absolute;
      background: var(--blue);
      width: 28vw;
      min-width: 160px;
      height: 38vh;
      top: 18vh;
      right: -4vw;
      z-index: 0;
    }

    .caption {
      position: absolute;
      left: 16px;
      bottom: 56px;
      max-width: 16rem;
      font-size: 13px;
      font-style: italic;
      line-height: 1.35;
      z-index: 3;
    }

    .issue {
      position: absolute;
      right: 16px;
      top: 48px;
      font-family: var(--display);
      font-size: clamp(18px, 3vw, 32px);
      letter-spacing: -0.03em;
      text-align: right;
      z-index: 3;
      line-height: 0.95;
    }

    .bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 28px;
      background: var(--signal);
      color: #000;
      font-family: var(--display);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 4;
    }

    .cut {
      margin-top: 8vh;
      margin-left: 42vw;
      width: min(48vw, 420px);
      background: var(--ink);
      color: var(--ground);
      padding: 20px 16px 24px;
      font-size: 14px;
      line-height: 1.4;
    }

    .cut strong {
      font-family: var(--display);
      font-weight: 400;
      font-size: 22px;
      letter-spacing: -0.03em;
      display: block;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .actions {
      margin-top: 16px;
      display: flex;
      gap: 0;
    }

    .btn {
      font-family: var(--display);
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border: 0;
      padding: 10px 14px;
      cursor: pointer;
      border-radius: 0;
    }

    .btn-alert {
      background: var(--alert);
      color: #fff;
    }

    .btn-alert:hover,
    .btn-alert:focus-visible {
      background: var(--blue);
      outline: 3px solid var(--signal);
      outline-offset: 0;
    }

    .btn-plain {
      background: var(--signal);
      color: #000;
    }

    .btn-plain:hover,
    .btn-plain:focus-visible {
      background: var(--alert);
      color: #fff;
      outline: none;
    }

    .tweaks-toggle,
    .tweaks {
      position: fixed;
      z-index: 20;
      bottom: 44px;
      right: 16px;
      font-family: var(--display);
    }

    .tweaks-toggle {
      background: var(--ink);
      color: var(--ground);
      border: 0;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 10px 12px;
      cursor: pointer;
      border-radius: 0;
    }

    .tweaks-toggle:focus-visible {
      outline: 3px solid var(--signal);
    }

    .tweaks {
      width: 240px;
      background: var(--ground);
      color: var(--ink);
      border: 4px solid var(--ink);
      padding: 16px;
      display: none;
    }

    .tweaks.is-open { display: block; }

    .tweaks h2 {
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .tweaks label {
      display: block;
      font-family: var(--serif);
      font-size: 12px;
      font-style: italic;
      margin-bottom: 8px;
    }

    .tweaks select {
      width: 100%;
      border: 2px solid var(--ink);
      background: var(--ground);
      color: var(--ink);
      font-family: var(--display);
      font-size: 12px;
      text-transform: uppercase;
      padding: 8px;
      border-radius: 0;
    }

    .tweaks-close {
      margin-top: 12px;
      background: var(--alert);
      color: #fff;
      border: 0;
      font-family: var(--display);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 8px 10px;
      cursor: pointer;
    }

    @media (max-width: 700px) {
      .issue { top: 40px; font-size: 16px; }
      .cut { margin-left: 16px; width: calc(100% - 32px); }
      .caption { max-width: 70%; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body data-ground="white">
  <header class="mast">
    <a href="index.html">Specimen 03</a>
    <span>Cover / Unset</span>
  </header>

  <main class="spread">
    <div class="slab" aria-hidden="true"></div>
    <p class="issue">VOL.<br />03</p>
    <h1 class="display">
      <span>Make</span>
      <span>it</span>
      <span class="loud">Loud</span>
    </h1>
    <p class="caption">The grid is a suggestion. Letters are allowed to hit the trim. Captions hide in the wrong corner on purpose.</p>
    <aside class="cut">
      <strong>No taste.</strong>
      Three colors. One grotesque. A yellow bar that refuses to recede.
      <div class="actions">
        <button class="btn btn-alert" type="button">Cut</button>
        <button class="btn btn-plain" type="button">Hold</button>
      </div>
    </aside>
  </main>

  <div class="bar">
    <span>Orange / Yellow / Blue</span>
    <span>Do not smooth</span>
  </div>

  <button class="tweaks-toggle" type="button" id="tweaksOpen">Tweaks</button>
  <aside class="tweaks" id="tweaks" hidden>
    <h2>Tweaks</h2>
    <label for="ground">Ground</label>
    <select id="ground">
      <option value="white">White</option>
      <option value="black">Black</option>
    </select>
    <button class="tweaks-close" type="button" id="tweaksClose">Close</button>
  </aside>

  <script>
    const root = document.body;
    const panel = document.getElementById("tweaks");
    const openBtn = document.getElementById("tweaksOpen");
    const closeBtn = document.getElementById("tweaksClose");
    const ground = document.getElementById("ground");

    function setOpen(open) {
      panel.hidden = !open;
      panel.classList.toggle("is-open", open);
      openBtn.hidden = open;
    }

    openBtn.addEventListener("click", () => setOpen(true));
    closeBtn.addEventListener("click", () => setOpen(false));
    ground.addEventListener("change", () => {
      root.setAttribute("data-ground", ground.value);
    });
  </script>
</body>
</html>
