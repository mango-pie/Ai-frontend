<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Specimen 06 — Mailchimp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --yellow: #FFE01B;
      --ink: #241C15;
      --cream: #FBEFE3;
      --muted: #88837C;
      --pop: #FF4D74;
      --ground: var(--yellow);
      --space-1: 8px;
      --space-2: 16px;
      --space-3: 24px;
      --space-4: 40px;
      --space-5: 64px;
      --r-sm: 8px;
      --r-md: 16px;
      --r-pill: 999px;
      --shadow: 0 4px 12px rgba(36, 28, 21, 0.08);
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    [data-ground="cream"] {
      --ground: var(--cream);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--ground);
      color: var(--ink);
      font-family: Outfit, "Helvetica Neue", sans-serif;
      font-size: 17px;
      line-height: 1.6;
      text-wrap: pretty;
    }

    a { color: inherit; text-decoration: none; }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: var(--space-5);
      padding: var(--space-4) var(--space-5);
      align-items: center;
    }

    header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: var(--space-3) var(--space-5);
      font-weight: 700;
      font-size: 14px;
    }

    nav {
      display: flex;
      gap: var(--space-3);
      color: var(--ink);
    }

    nav a:hover,
    nav a:focus-visible {
      text-decoration: underline;
      text-underline-offset: 4px;
      outline: none;
    }

    h1 {
      font-weight: 800;
      font-size: clamp(40px, 6.5vw, 76px);
      line-height: 1.05;
      letter-spacing: -0.03em;
      margin: var(--space-3) 0;
    }

    .lede {
      max-width: 22em;
      margin-bottom: var(--space-4);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
    }

    .btn {
      font-family: Outfit, sans-serif;
      font-weight: 700;
      font-size: 15px;
      border: 2.5px solid var(--ink);
      background: var(--ink);
      color: var(--yellow);
      border-radius: var(--r-pill);
      padding: 10px 22px;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 280ms var(--spring);
    }

    [data-ground="cream"] .btn {
      color: var(--cream);
    }

    .btn:hover,
    .btn:focus-visible {
      transform: translateY(-3px);
      outline: none;
    }

    .btn-ghost {
      background: transparent;
      color: var(--ink);
    }

    .note {
      margin-top: var(--space-3);
      font-size: 14px;
      color: var(--muted);
    }

    .still {
      justify-self: center;
      transform: rotate(-6deg);
      width: min(100%, 320px);
    }

    .still-frame {
      aspect-ratio: 4 / 5;
      background: var(--cream);
      border: 2.5px solid var(--ink);
      border-radius: var(--r-md);
      display: grid;
      place-items: center;
      box-shadow: var(--shadow);
    }

    [data-ground="cream"] .still-frame {
      background: var(--yellow);
    }

    .still-frame span {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    figcaption {
      margin-top: var(--space-2);
      font-size: 14px;
      color: var(--muted);
      transform: rotate(6deg);
    }

    .tweaks-toggle,
    .tweaks {
      position: fixed;
      z-index: 20;
      bottom: 20px;
      right: 20px;
      font-family: Outfit, sans-serif;
    }

    .tweaks-toggle {
      background: var(--ink);
      color: var(--yellow);
      border: 2.5px solid var(--ink);
      border-radius: var(--r-pill);
      font-weight: 700;
      font-size: 13px;
      padding: 8px 16px;
      cursor: pointer;
      box-shadow: var(--shadow);
    }

    .tweaks-toggle:focus-visible { outline: 3px solid var(--pop); outline-offset: 2px; }

    .tweaks {
      width: 250px;
      background: var(--cream);
      color: var(--ink);
      border: 2.5px solid var(--ink);
      border-radius: var(--r-md);
      padding: 16px;
      box-shadow: var(--shadow);
      display: none;
    }

    .tweaks.is-open { display: block; }

    .tweaks h2 {
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .tweaks label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .tweaks select {
      width: 100%;
      border: 2px solid var(--ink);
      border-radius: var(--r-sm);
      background: #fff;
      color: var(--ink);
      font-family: Outfit, sans-serif;
      padding: 8px;
    }

    .tweaks-close {
      margin-top: 12px;
      background: none;
      border: 0;
      font-family: Outfit, sans-serif;
      font-weight: 700;
      cursor: pointer;
      color: var(--ink);
    }

    @media (max-width: 800px) {
      .page {
        grid-template-columns: 1fr;
        padding: 96px var(--space-3) var(--space-5);
      }
      header { padding: var(--space-3); }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
    }
  </style>
</head>
<body data-ground="yellow">
  <header>
    <a href="index.html">Specimen</a>
    <nav>
      <a href="#">Send</a>
      <a href="#">Learn</a>
      <a href="#">Hang out</a>
    </nav>
  </header>

  <main class="page">
    <section>
      <h1>Send better email. Then go outside.</h1>
      <p class="lede">Tools for people who would rather talk like a person than optimize a funnel. Yellow is not a warning. It is the room.</p>
      <div class="actions">
        <button class="btn" type="button">Start a draft</button>
        <button class="btn btn-ghost" type="button">Maybe later</button>
      </div>
      <p class="note">No mascot in this file. The illustration is still outstanding.</p>
    </section>
    <figure class="still">
      <div class="still-frame" role="img" aria-label="Illustration pending, 4 by 5">
        <span>4:5 illustration</span>
      </div>
      <figcaption>Hand-drawn character, tilted on purpose.</figcaption>
    </figure>
  </main>

  <button class="tweaks-toggle" type="button" id="tweaksOpen">Tweaks</button>
  <aside class="tweaks" id="tweaks" hidden>
    <h2>Tweaks</h2>
    <label for="ground">Ground</label>
    <select id="ground">
      <option value="yellow">Yellow flood</option>
      <option value="cream">Cream body</option>
    </select>
    <button class="tweaks-close" type="button" id="tweaksClose">Close</button>
  </aside>

  <script>
    const root = document.body;
    const panel = document.getElementById("tweaks");
    const openBtn = document.getElementById("tweaksOpen");
    const closeBtn = document.getElementById("tweaksClose");
    const ground = document.getElementById("ground");

    function setOpen(open) {
      panel.hidden = !open;
      panel.classList.toggle("is-open", open);
      openBtn.hidden = open;
    }

    openBtn.addEventListener("click", () => setOpen(true));
    closeBtn.addEventListener("click", () => setOpen(false));
    ground.addEventListener("change", () => root.setAttribute("data-ground", ground.value));
  </script>
</body>
</html>
